services:
  db:
    image: postgres:16-alpine
    container_name: zeff-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zeff
      POSTGRES_PASSWORD: zeff
      POSTGRES_DB: zeff
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeff -d zeff"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
